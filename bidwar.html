<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCL Bid War Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Uncial+Antiqua&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/bidwar.css">
</head>
<body class="wars">
<!--
  Bottom-bar bid war rotator, the companion to bar.html.

  In OBS add a Browser source pointing at bidwar.html, size it 560 x 106, and
  place it at X 1345, Y 974 — right of bar.html (which ends at X 1330), out to
  the right edge of the frame. Everything scales to fit the source, so a
  smaller source keeps the same layout.

  It takes turns showing:
    - the Party Game bid war as a head-to-head VS bar
    - the top Pick a Baddie League write-ins

  Totals are the same Saturday Form tally as bar.html and the slideshow, so
  only mod-approved votes count. Settings are in js/config.js under
  `bidwarBar`. Extras:
    &only=party     show one panel only (party or league), no rotation
    &seconds=15     same time on both panels (normally 10s party, 20s league)
    &demo=1         made-up numbers, for lining it up in OBS
    &chroma=00b140  solid key colour instead of transparency
-->
<main class="wars__panel" id="root">
  <section class="wars__slide" id="slide-party" aria-label="Party Game bid war">
    <div class="wars__kicker">
      <span id="party-title">Pick a Party Game</span>
      <span class="wars__total" id="party-total"></span>
    </div>
    <div class="vs__names">
      <div class="vs__side vs__side--left">
        <span class="vs__name" id="vs-left-name"></span>
        <span class="vs__amount" id="vs-left-amount"></span>
      </div>
      <span class="vs__badge">VS</span>
      <div class="vs__side vs__side--right">
        <span class="vs__amount" id="vs-right-amount"></span>
        <span class="vs__name" id="vs-right-name"></span>
      </div>
    </div>
    <div class="vs__track">
      <div class="vs__fill vs__fill--left" id="vs-left-fill"></div>
      <div class="vs__fill vs__fill--right" id="vs-right-fill"></div>
      <div class="vs__mid"></div>
    </div>
  </section>

  <section class="wars__slide" id="slide-league" aria-label="Pick a Baddie League bid war">
    <div class="wars__kicker">
      <span id="league-title">Pick a Baddie League</span>
      <span class="wars__total" id="league-total"></span>
    </div>
    <div class="league__viewport" id="league-viewport">
      <ol class="league" id="league-list"></ol>
    </div>
  </section>
</main>
<script type="module" src="js/bidwar.js"></script>
</body>
</html>
